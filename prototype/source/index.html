<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bored Doom — Interactive Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
:root{--bg:#16302B;--bg2:#1E3D37;--bg3:#0F2420;--line:#2E4F48;--amber:#E88D4F;--amberD:#C26E36;--cream:#F9F6F0;--card:#F9F6F0;--fg:249,246,240;--creamD:#DDD6C8;--illo:#FEF4E8;--muted:#A9BDB7;--ink:#16302B;--ink2:#4A635D;--green:#7BC47F;--coral:#E5604D;--sun:#F2CC6B;
--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0A1513;font-family:'Nunito',system-ui,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:28px}
#phone{position:relative;width:390px;height:844px;flex-shrink:0;border-radius:54px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 11px #050c0b,0 0 0 12px #2a3a36,0 40px 90px rgba(0,0,0,.55)}
#app{position:absolute;inset:0;overflow:hidden}
.side{width:300px;display:flex;flex-direction:column;gap:14px}
.side h1{font-size:30px;line-height:34px;margin:0;font-weight:800}
.side p{margin:0;color:var(--muted);font-weight:600;line-height:1.5}
.side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:f}
.side li button{width:100%;text-align:left;background:#12241F;border:1px solid #1F3A34;color:var(--cream);border-radius:12px;padding:9px 12px;font:700 14px 'Nunito',sans-serif;display:flex;gap:10px;align-items:center}
.side li button:hover{border-color:var(--amber)}
.side li button span{color:var(--amber);font-weight:800;min-width:20px}
@media (max-width:760px){.side{display:none}}
@media (max-width:520px){#stage{padding:0}#phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}

/* screens & navigation */
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.screen.dark{background:#0E211D}.screen.night{background:#09140F}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 54px) 20px calc(118px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*:not(.spacer){flex-shrink:0}
.nosb .scroll,.scroll.nosb{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.push-enter{animation:pushIn .44s var(--ease) both;box-shadow:-20px 0 40px rgba(0,0,0,.35)}
.push-under{animation:pushUnder .44s var(--ease) both}
.pop-exit{animation:pushOut .36s var(--ease) both;box-shadow:-20px 0 40px rgba(0,0,0,.35)}
.pop-reveal{animation:popReveal .36s var(--ease) both}
.modal-enter{animation:modalIn .52s var(--spring) both}
.modal-exit{animation:modalOut .36s var(--ease) both}
.zoom-enter{animation:zoomIn .5s var(--spring) both}
.fade-in{animation:fadeIn .28s ease both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushUnder{from{transform:none;filter:none}to{transform:translateX(-28%);filter:brightness(.6)}}
@keyframes pushOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes popReveal{from{transform:translateX(-28%);filter:brightness(.6)}to{transform:none;filter:none}}
@keyframes modalIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes modalOut{from{transform:none}to{transform:translateY(100%)}}
@keyframes zoomIn{from{transform:scale(.25);opacity:0;border-radius:48px}to{transform:none;opacity:1;border-radius:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.stagger>*{animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* type & basics */
.over{font-size:12px;font-weight:800;letter-spacing:.09em;color:var(--muted)}
.amber{color:var(--amber)!important}
h1.large{font-size:32px;line-height:38px;font-weight:800;margin:2px 0 0}
.title{font-size:30px;line-height:36px;font-weight:800;margin:0}
.center{text-align:center}
.muted{color:var(--muted);font-weight:600;font-size:15px;line-height:1.4;margin:0}
.section{font-size:18px;font-weight:800;margin:10px 4px 0}
.card{background:var(--bg2);border-radius:24px;padding:16px}
.card.cream{background:var(--card);color:var(--ink);box-shadow:0 8px 16px rgba(0,0,0,.18)}
.row{display:flex;align-items:center;gap:14px}
.col{display:flex;flex-direction:column;gap:14px}
.grow{flex:1;min-width:0}
.spacer{flex:1;min-height:12px}
button{font-family:inherit;cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s,background .2s,opacity .2s,border-color .2s}
button:not(.btn):not(.tab-sos):active{transform:scale(.96)}
.btn{display:block;width:100%;border:none;border-radius:20px;padding:18px;font:800 17px 'Nunito',sans-serif;text-align:center}
.btn.primary{background:var(--amber);color:var(--ink);box-shadow:0 6px 16px rgba(232,141,79,.28)}
.btn.primary:active{transform:scale(.97);box-shadow:0 2px 8px rgba(232,141,79,.25)}
.btn.ghost{background:var(--bg2);color:var(--cream);box-shadow:0 0 0 transparent;border:2px solid var(--line)}
.btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bg3)}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:none;color:var(--muted);font:800 15px 'Nunito',sans-serif;padding:10px;align-self:center}
.icon-btn{width:44px;height:44px;border-radius:22px;border:none;background:var(--bg2);color:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;background:var(--bg2);border:2px solid var(--line);color:var(--cream)}
.chip{border-radius:999px;padding:9px 14px;font:800 14px 'Nunito',sans-serif;border:2px solid var(--line);background:transparent;color:var(--cream)}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.illo{background:var(--illo);display:block;object-fit:cover}
.note{font-size:12px;font-weight:700;color:var(--muted);background:rgba(var(--fg),.06);border:1px dashed rgba(var(--fg),.18);border-radius:12px;padding:8px 10px;text-align:center}

/* Milo */
.milo{display:block;overflow:visible}
.milo .milo-body{transform-box:view-box;transform-origin:100px 175px;animation:breathe 3.6s ease-in-out infinite}
.milo.still .milo-body{animation:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.milo .blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.milo .eyes-closed{display:none}
.milo.petting .eyes-open{display:none}.milo.petting .eyes-closed{display:inline}
.milo.petting .milo-body{animation:wiggle .2s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-4deg) scale(1.04)}to{transform:rotate(4deg) scale(1.04)}}
.milo .cheek{opacity:.65;transition:opacity .2s}.milo.petting .cheek{opacity:1}
.bounce{animation:bounce .6s var(--spring)}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.rub{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.heart{position:absolute;pointer-events:none;z-index:5;animation:heartUp 1s ease-out forwards}
@keyframes heartUp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{transform:translate(calc(-50% + var(--dx)),-300%) scale(.8);opacity:0}}

/* tab bar */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom));padding:10px 6px env(safe-area-inset-bottom);background:rgba(13,31,27,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #24453F;display:flex;justify-content:space-around;align-items:flex-start;z-index:20;transition:transform .42s var(--ease)}
#tabbar.hide{transform:translateY(115%)}
.tab{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px 'Nunito',sans-serif;min-width:58px;min-height:44px;padding:0}
.tab.on{color:var(--amber)}
.tab-sos{width:66px;height:66px;margin-top:-30px;border-radius:33px;background:var(--amber);border:5px solid var(--bg);color:var(--ink);font:800 15px 'Nunito',sans-serif;animation:sosPulse 2.6s infinite}
.tab-sos:active{transform:scale(.92)}
@keyframes sosPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,141,79,.5)}50%{box-shadow:0 0 0 12px rgba(232,141,79,0)}}

/* sheets, banners, toasts */
.sheet-wrap{position:absolute;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .35s}
.sheet-wrap.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);color:var(--ink);border-radius:30px 30px 0 0;padding:8px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s var(--spring);display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.sheet-wrap.open .sheet{transform:none}
.grabber{width:40px;height:5px;border-radius:3px;background:#CFC7B8;margin:4px auto 6px;flex-shrink:0;touch-action:none}
.sheet .muted{color:var(--ink2)}
.sheet .over{color:var(--ink2)}
.banner{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:70;background:rgba(36,66,59,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;padding:12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(-150%);transition:transform .55s var(--spring);box-shadow:0 14px 30px rgba(0,0,0,.35);cursor:pointer}
.banner.show{transform:none}
.app-ic{width:40px;height:40px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.toast{pointer-events:none;position:absolute;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));z-index:80;transform:translate(-50%,20px);opacity:0;background:var(--card);color:var(--ink);font-weight:800;font-size:14px;padding:12px 18px;border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.3);transition:all .4s var(--spring);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* today */
.milo-card{display:flex;flex-direction:column;gap:14px;padding:16px}
.bubble{font-size:17px;font-weight:800;line-height:1.3;transition:opacity .25s,transform .25s}
.bubble.swap{opacity:0;transform:translateY(6px)}
.hint{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink2);background:#EFE9DE;padding:5px 9px;border-radius:999px;align-self:flex-start}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:16px;border:2px solid #E4DDCF;background:#fff;color:var(--ink);font:800 12px 'Nunito',sans-serif;box-shadow:0 0 0 transparent}
.mi{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.pulse{animation:pulseRing 1.2s ease 2}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(232,141,79,0)}50%{box-shadow:0 0 0 8px rgba(232,141,79,.45)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:118px;padding:14px;border-radius:22px;border:none;background:var(--bg2);color:var(--cream);text-align:left}
.tool b{font-size:16px;font-weight:800}.tool small{font-size:13px;font-weight:700;color:var(--muted);margin-top:-6px}
.tic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(232,141,79,.16);color:var(--amber)}
.rowcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;border:none;background:var(--bg2);color:var(--cream);text-align:left;width:100%}
.rowcard b{display:block;font-size:16px;font-weight:800}.rowcard small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.dot-on{width:8px;height:8px;border-radius:4px;background:var(--green);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(123,196,127,.2)}

/* picks */
.picks{display:flex;flex-direction:column;gap:10px}
.pick{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--ink);border:none;border-radius:20px;padding:14px;text-align:left;box-shadow:0 0 0 transparent;width:100%}
.pick .pi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick b{display:block;font-size:16px;font-weight:800}.pick small{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}
.speech{background:var(--card);color:var(--ink);border-radius:22px 22px 22px 6px;padding:14px 16px;font-size:15px;font-weight:700;line-height:1.4;box-shadow:0 8px 16px rgba(0,0,0,.18)}
.encourage{display:flex;align-items:center;gap:10px;background:rgba(123,196,127,.13);border:1px solid rgba(123,196,127,.4);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700}

/* ring timers */
.ring-wrap{position:relative;width:270px;height:270px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring .bg{stroke:rgba(var(--fg),.08)}
.ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.big-time{font-size:46px;line-height:50px;font-weight:800;font-variant-numeric:tabular-nums}
.swaps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-self:stretch}
.swap{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:78px;border-radius:18px;border:2px solid var(--line);background:var(--bg2);color:var(--cream);font:800 13px 'Nunito',sans-serif;padding:10px 6px;position:relative}
.swap.done{border-color:var(--green);background:rgba(123,196,127,.14)}
.swap .ck{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:11px;background:var(--green);color:var(--ink);display:none;align-items:center;justify-content:center}
.swap.done .ck{display:flex;animation:bounce .5s var(--spring)}
.msg-dark{align-self:stretch;background:var(--card);color:var(--ink);border-radius:20px;padding:14px 16px;font-size:16px;line-height:22px;font-weight:800;text-align:center;transition:opacity .3s,transform .3s}
.msg-dark.swap-out{opacity:0;transform:scale(.97)}

/* breathe */
.breath{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.halo{position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(232,141,79,.08);transform:scale(.8);transition-property:transform;transition-timing-function:cubic-bezier(.45,0,.55,1)}
.halo2{width:250px;height:250px;background:rgba(232,141,79,.1)}
.orb{position:relative;width:200px;height:200px;border-radius:50%;border:4px solid var(--amber);overflow:hidden;transform:scale(.85);transition-property:transform;transition-timing-function:cubic-bezier(.45,0,.55,1)}
.orb img{width:100%;height:100%}
.phase{font-size:32px;font-weight:800;transition:opacity .4s}
.phase.fade{opacity:0}
.ppill{font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--bg2);color:var(--muted);transition:all .3s}
.ppill.on{background:var(--amber);color:var(--ink)}

/* deck */
.deck{position:relative;height:440px;flex-shrink:0;margin-top:6px}
.dcard{position:absolute;inset:0;background:var(--card);color:var(--ink);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 28px rgba(0,0,0,.28);transition:transform .45s var(--spring),opacity .3s;touch-action:none;user-select:none;-webkit-user-select:none}
.dcard.p0{z-index:3;cursor:grab}.dcard.p1{z-index:2;transform:translateY(16px) scale(.94);background:#ECE5D8}.dcard.p2{z-index:1;transform:translateY(32px) scale(.88);background:#DDD6C8}.dcard.px{opacity:0;transform:translateY(40px) scale(.84);pointer-events:none}
.dcard.p1>*,.dcard.p2>*{opacity:.0}
.dtag{align-self:flex-start;background:#FCE3D1;color:#8A4517;font-size:12px;font-weight:800;letter-spacing:.06em;padding:6px 10px;border-radius:999px}
.dart{height:190px;border-radius:22px;background:var(--illo);display:flex;align-items:center;justify-content:center}
.stamp{position:absolute;top:26px;font-size:22px;font-weight:800;padding:6px 12px;border-radius:10px;border:3px solid;opacity:0;transform:rotate(-12deg)}
.stamp.do{right:20px;color:#3E8E45;border-color:#3E8E45;transform:rotate(12deg)}
.stamp.skip{left:20px;color:var(--coral);border-color:var(--coral)}
.deck-btns{display:flex;align-items:center;justify-content:center;gap:20px}
.round{width:64px;height:64px;border-radius:32px;border:2px solid var(--line);background:var(--bg2);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 transparent}

/* find milo */
.fm{position:absolute;inset:0;overflow:hidden;background:#5B6B66;touch-action:none;cursor:grab}
.fm-world{position:absolute;left:0;top:0;width:1240px;height:1000px;will-change:transform}
.fm-world div{position:absolute}
.fm-milo{transition:transform .7s var(--spring);touch-action:none}
.fm-milo.found{transform:translateY(-62px)}
.vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 150px rgba(0,0,0,.65)}
.reticle{position:absolute;left:50%;top:46%;width:190px;height:190px;transform:translate(-50%,-50%);pointer-events:none;transition:all .4s var(--spring)}
.reticle i{position:absolute;width:28px;height:28px;border:4px solid rgba(var(--fg),.9)}
.reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.reticle.hot i{border-color:var(--amber)}
.reticle.found{width:230px;height:230px;opacity:0}
.hud-top{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 54px);display:flex;align-items:center;justify-content:space-between;z-index:3}
.glass{background:rgba(14,33,29,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hud-bot{position:absolute;left:14px;right:14px;bottom:calc(30px + env(safe-area-inset-bottom));border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;z-index:3}
.radar{position:relative;width:64px;height:64px;border-radius:32px;border:2px solid var(--line);flex-shrink:0}
.radar::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:3px;background:var(--card)}
.radar .rd{position:absolute;width:12px;height:12px;margin:-6px;border-radius:6px;background:var(--amber);box-shadow:0 0 0 5px rgba(232,141,79,.25);transition:left .2s,top .2s}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--amber);border-radius:5px;transition:width .2s}
.start-ov{position:absolute;inset:0;z-index:6;background:rgba(9,20,17,.72);display:flex;align-items:flex-end;padding:20px 16px calc(30px + env(safe-area-inset-bottom));transition:opacity .35s}
.start-ov.gone{opacity:0;pointer-events:none}

/* win */
.conf-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
.conf{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),920px) rotate(var(--r))}}
.win-illo{width:240px;height:240px;border-radius:40px;box-shadow:0 14px 30px rgba(0,0,0,.3);animation:popIn .8s var(--spring) both}
@keyframes popIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:none}}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-self:stretch}
.stat{background:var(--bg2);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.stat small{font-size:12px;font-weight:700;color:var(--muted)}

/* closet */
.stage{position:relative;height:250px;border-radius:32px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.stage::before{content:"";position:absolute;bottom:-120px;width:380px;height:200px;border-radius:50%;background:var(--line)}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:112px;border-radius:20px;border:2px solid #E4DDCF;background:var(--card);color:var(--ink);font:800 13px 'Nunito',sans-serif}
.item.on{border:3px solid var(--amber)}
.item.locked{background:var(--bg2);border-color:var(--line);color:var(--cream)}
.item.locked svg.art{opacity:.55}
.item .tag{position:absolute;top:-9px;font-size:12px;font-weight:800;letter-spacing:.06em;background:var(--amber);color:var(--ink);padding:2px 8px;border-radius:999px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* insights */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.wd i{width:32px;height:32px;border-radius:16px;background:var(--amber);display:flex;align-items:center;justify-content:center;transform:scale(0);animation:popDot .5s var(--spring) forwards;animation-delay:calc(var(--i)*70ms + .2s)}
.wd i.today{background:none;border:3px dashed var(--amber)}
@keyframes popDot{to{transform:none}}
.hbars{display:grid;grid-template-columns:72px minmax(0,1fr) 24px;gap:9px 10px;align-items:center;font-size:14px;font-weight:800}
.hb{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.hb>i{display:block;height:100%;width:0;border-radius:7px;background:var(--muted);transition:width 1s var(--ease)}
.vbars{display:flex;align-items:flex-end;justify-content:space-between;height:130px;gap:12px;padding-top:8px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;font-weight:800;color:var(--muted)}
.vb>i{width:100%;border-radius:10px 10px 6px 6px;background:var(--line);height:0;transition:height 1s var(--ease)}
.vb.hot>i{background:var(--amber)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal i{aspect-ratio:1;border-radius:8px;background:var(--amber);opacity:0;animation:fadeIn .3s ease forwards;animation-delay:calc(var(--i)*18ms)}
.cal i.slip{background:var(--line)}.cal i.today{background:none;border:2px dashed var(--amber)}

/* settings */
.group{background:var(--bg2);border-radius:20px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:none;background:none;color:var(--cream);width:100%;text-align:left;font:700 15px 'Nunito',sans-serif;border-bottom:1px solid #24453F}
.srow:last-child{border-bottom:none}
.srow .si{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srow small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.srow:active{background:rgba(255,255,255,.04);transform:none!important}
.gl{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:10px 8px -6px}
.switch{width:51px;height:31px;border-radius:16px;background:#3A5550;position:relative;flex-shrink:0;transition:background .25s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.switch.on{background:var(--green)}.switch.on::after{transform:translateX(20px)}

/* fake home screen */
.hs{position:absolute;inset:0;background:#21423B;overflow:hidden}
.hs::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:#2A5047;left:-200px;top:-120px}
.hs::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#1B3732;right:-180px;bottom:-60px}
.hs-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 10px;padding:0 22px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:#fff;font:700 11px 'Nunito',sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.app .ai{width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.2);overflow:hidden}
.dock{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));height:92px;border-radius:30px;background:rgba(var(--fg),.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:1;display:flex;align-items:center;justify-content:space-around}
.launch{position:absolute;z-index:30;border-radius:15px;transition:all .42s var(--spring)}
.shield-ov{position:absolute;inset:0;z-index:40;background:rgba(9,20,17,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:flex-end;opacity:0;transition:opacity .35s}
.shield-ov.show{opacity:1}
.shield-card{width:100%;background:var(--card);color:var(--ink);border-radius:32px 32px 0 0;padding:18px 20px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translateY(100%);transition:transform .55s var(--spring)}
.shield-ov.show .shield-card{transform:none}
.feed{position:absolute;inset:0;z-index:45;background:#F2F2F2;color:#222;display:flex;flex-direction:column;animation:fadeIn .3s}
.post{background:#fff;margin:10px 12px 0;border-radius:16px;padding:12px}
.sk{background:#E6E6E6;border-radius:8px}

/* night / bedtime */
.star{position:absolute;width:3px;height:3px;border-radius:2px;background:#F9F6F0;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.hold{position:relative;overflow:hidden}
.hold>i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(232,141,79,.35)}
.hold.holding>i{width:100%;transition:width 1.2s linear}
.hold span{position:relative}

/* phone down */
.flip{animation:flip 2.4s var(--ease) infinite}
@keyframes flip{0%,20%{transform:rotateY(0)}50%,70%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
[data-state] [data-show]{display:none}
[data-state="setup"] [data-show~="setup"],[data-state="wait"] [data-show~="wait"],[data-state="run"] [data-show~="run"],[data-state="paused"] [data-show~="paused"]{display:flex}

/* ===== v2 refinements ===== */
h1.large,.title,.hero-q,.big-time{font-weight:900}
.amber{color:#F4B27F!important}
.tab.on{color:var(--cream)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(var(--fg),.25))}
.chip.on{background:var(--card);border-color:var(--cream);color:var(--ink)}
.ppill.on{background:var(--card);color:var(--ink)}

.item.on{border:3px solid #2E6B5E}.item .tag{background:var(--ink);color:var(--cream)}
.wd i{background:#7FA89C}.wd i.today{border-color:var(--cream)}
.cal i{background:#7FA89C}.cal i.today{border-color:var(--cream)}
.vb.hot>i{background:var(--amber)}
.orb{border-color:#9FD0BD}.halo{background:rgba(159,208,189,.06)}.halo2{background:rgba(159,208,189,.09)}

.hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0 4px}
.say{background:var(--card);color:var(--ink);font-weight:700;font-size:15px;line-height:1.35;padding:12px 16px;border-radius:20px 20px 20px 6px;max-width:290px;text-align:center;transition:opacity .25s,transform .25s;box-shadow:0 8px 16px rgba(0,0,0,.18)}

.hero-milo{width:190px}
.hero-q{margin:0 0 10px;font-size:26px;line-height:32px;text-align:center}
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-self:stretch}
.face{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;color:var(--cream);font:700 13px 'Nunito',sans-serif;padding:0}
.fc{width:62px;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 transparent}
.sheet .face{color:var(--ink)}.sheet .fc{box-shadow:0 0 0 transparent}
.hint-dark{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
.pulse .faces{animation:pulseRing 1.2s ease 2;border-radius:20px}
/* screen temperatures: navy for crisis & calm, cream for celebration */
.screen.dark{background:#0E1823}
.screen.night{background:#0A1219}
.dark .swap,.dark .ppill{background:#16222E;border-color:#22344A}
.dark .ppill.on{background:var(--card)}
.dark .icon-btn{background:#16222E}
.dark .btn.ghost{background:#16222E;border-color:#22344A;box-shadow:0 0 0 transparent}
.night .rowcard{background:#121C26!important}.night .hold{background:#121C26!important;border-color:#1E2C3A!important}
.screen.warm{background:#F7EFE2;color:var(--ink)}
.warm .muted,.warm .link{color:var(--ink2)}
.warm .stat{background:#fff;box-shadow:0 0 0 transparent}.warm .stat small{color:var(--ink2)}
.warm .amber{color:#A8541E!important}
.warm .win-illo{box-shadow:0 14px 30px rgba(120,80,40,.18)}

/* ===== v3 features ===== */
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes floaty{50%{transform:translateY(-6px)}}
.side ol{max-height:600px;overflow:auto;padding-right:4px}
.side li button{padding:7px 12px;font-size:13px}

.mercy{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#9FD0BD;background:rgba(159,208,189,.12);padding:4px 9px;border-radius:999px}
.playc{width:38px;height:38px;border-radius:19px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.sup>b{color:var(--ink);font-size:15px}
/* forecast */
.fc-card{display:flex;flex-direction:column;gap:12px;background:var(--bg2);border:none;border-radius:22px;padding:14px 16px;color:var(--cream);text-align:left;width:100%}
.fc-head{display:flex;align-items:center;gap:12px}.fc-head b{display:block;font-size:17px}.fc-head small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.fc-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-top:1px solid #24453F;padding-top:10px}
.fc-strip span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.fc-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0}
.storm{position:relative;width:96px;height:120px;animation:floaty 3.5s ease-in-out infinite}
.drops i{position:absolute;top:80px;width:3px;height:12px;border-radius:2px;background:#9FB8D9;opacity:0;animation:drop 1s linear infinite}
@keyframes drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.fc-row{display:flex;gap:12px;background:var(--bg2);border-radius:18px;padding:12px 14px}

.fc-ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.risk{height:6px;border-radius:3px;background:#24453F;margin:8px 0;overflow:hidden}.risk i{display:block;height:100%;width:0;border-radius:3px;transition:width 1s var(--ease)}
.fc-plan{display:flex;gap:6px;align-items:flex-start;font-size:13px;font-weight:600;color:#D7E2DE}.fc-plan svg{flex-shrink:0;margin-top:2px;color:#9FD0BD}
/* finite feed */
.feed-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 50px) 16px 10px;gap:10px}
.fbar{height:4px;margin:0 16px;border-radius:2px;background:#24453F;overflow:hidden;flex-shrink:0}.fbar i{display:block;height:100%;width:10%;background:var(--card);transition:width .3s}
.feedwrap{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feedwrap::-webkit-scrollbar{display:none}
.fcard{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:14px 16px 26px;display:flex}

/* wrapped */

.w-sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.w-sg div{background:#EFE9DE;border-radius:14px;padding:10px 6px;text-align:center}.w-sg b{display:block;font-size:20px}.w-sg small{font-size:12px;font-weight:700;color:#4A635D}

/* pack */

.r-art{border:6px solid #8A6B55;object-fit:cover;background:var(--illo)}
.r-slot{border:2px dashed rgba(var(--fg),.2)}
.r-rug{left:50%;top:198px;width:250px;height:44px;margin-left:-125px;border-radius:50%;background:#6E8F86}
.r-bed{left:50%;top:172px;width:150px;height:52px;margin-left:-75px;border-radius:26px;background:#C65A2E;box-shadow:inset 0 -10px 0 #A84A24}

 0%{transform:translateX(100%);box-shadow:-18px 0 40px rgba(0,0,0,.35);animation-timing-function:cubic-bezier(.2,.75,.3,1)}

@keyframes jfUp{from{transform:translateY(100%)}}@keyframes jfDown{to{transform:translateY(100%)}}

.home-scroll .hero-q{font-size:22px!important;line-height:28px!important;margin:8px 0 4px!important}
